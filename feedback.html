<!DOCTYPE html>
<html>
<head>
    <title>FoodieHub - Feedback</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #fff3e0;
            text-align: center;
            padding: 30px;
        }

        h1 {
            color: #ff6b00;
        }

        input, textarea {
            width: 300px;
            padding: 12px;
            margin: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }

        textarea {
            height: 100px;
        }

        button {
            background-color: #ff6b00;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>🍴 FoodieHub</h1>

    <h2>Feedback</h2>

    <input type="text" placeholder="Enter your name">

    <br>

    <input type="email" placeholder="Enter your email">

    <br>

    <textarea placeholder="Write your feedback"></textarea>

    <br>

    <button onclick="submitFeedback()">Submit Feedback</button>

    <script>
        function submitFeedback() {
            alert("Thank you for your feedback! 😊");
        }
    </script>

</body>
</html>
